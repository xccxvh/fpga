# ===========================================================================
#  Ti60F225 + Sapphire SoC 调试配置（co_debug 变体 bitstream）
#
#  用法： openocd -f openocd_ti60.cfg -c "..." -c "shutdown"
#
#  这份配置是厂商 ftdi_ti.cfg + debug_ti.cfg 的合并版，并修掉了三个坑，
#  每个坑的说明见下面注释。改之前先读一遍——这三个坑的报错信息都极具误导性。
# ===========================================================================

# --- 1. FTDI 适配器 --------------------------------------------------------
adapter driver ftdi
transport select jtag

# 【坑 1】按 vid_pid 匹配，不要写 device_desc。
# 厂商配置里写了 ftdi device_desc "Titanium Ti60F225 Development Kit"，
# 但板上的 FT4232H 实际自报 "Quad RS232-HS"，字符串对不上就报
#     Error: no device found
# 报错完全不提是描述串的问题，会误判成权限/驱动/线缆问题。
ftdi vid_pid 0x0403 0x6011

# JTAG 占 FT4232H 的 channel B（0=A, 1=B, 2=C, 3=D）
# SoC 的串口是 channel C，即 /dev/ttyUSB2
ftdi channel 1

# DBUS0=TCK  DBUS1=TDI  DBUS2=TDO  DBUS3=TMS
ftdi layout_init 0x08 0x0b

# --- 2. 时钟与复位 ---------------------------------------------------------
adapter speed 800
adapter srst delay 260
jtag_ntrst_delay 250

# --- 3. TAP ----------------------------------------------------------------
# 【坑 2】irlen 必须用 5、ircapture 必须用 0x5。
# 硬件实测 IR capture = 0x05。厂商的 debug_softTap.cfg 用 irlen 4 /
# ircapture 0x1，会报 "IR capture error; saw 0x05 not 0x01"。
set _CHIPNAME fpga_spinal
jtag newtap $_CHIPNAME bridge -expected-id 0x10660a79 -irlen 5 -ircapture 0x5 -irmask 0xF

# --- 4. CPU target ---------------------------------------------------------
target create $_CHIPNAME.cpu0 vexriscv \
    -endian little \
    -chain-position $_CHIPNAME.bridge \
    -coreid 0 \
    -dbgbase 0x10B80000 \
    -work-area-phys 0xF9000000 \
    -work-area-size 1024

vexriscv readWaitCycles 40

# 【坑 3】下面这两行必须要有，厂商的 debug_ti.cfg 里恰好没有。
#
# 少了 cpuConfigFile，openocd 就不知道这个 CPU 带 4KB iCache（见 cpu0.yaml），
# 不会做 cache flush；少了 jtagMapping，DMI 位映射也是错的。
# 症状是读出来全是"移位"的垃圾值：
#     reg pc 0x1000  ->  读回 0x00000008    （高 12 位凭空消失）
#     mww 0x1000 0xdeadbeef  ->  读回垃圾
# 而且 target examination **不报错**，看起来像连上了，极难怀疑到配置上。
#
# 加上这两行，同一个 openocd 立刻正常。
vexriscv cpuConfigFile [file dirname [info script]]/cpu0.yaml
vexriscv jtagMapping 8 8 0 1 2 2
